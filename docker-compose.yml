# Local Airflow in one container: docker compose up, then open http://localhost:8080
# The admin password is printed in the logs (docker compose logs airflow | grep password).
services:
  airflow:
    image: apache/airflow:2.10.4-python3.11
    command: standalone
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Asia/Karachi"
      PSX_PIPELINE_HOME: /opt/airflow/psx-pipeline
      _PIP_ADDITIONAL_REQUIREMENTS: "psxdata pyarrow matplotlib boto3 duckdb dbt-snowflake dbt-duckdb snowflake-connector-python[pandas]"
    env_file: [.env]          # SNOWFLAKE_* and AWS_* go here (never commit .env)
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/psx-pipeline
      - ~/.dbt:/home/airflow/.dbt:ro
