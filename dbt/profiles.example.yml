# Copy to ~/.dbt/profiles.yml. Secrets come from environment variables.
psx:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: PSX
      schema: MART
      threads: 4
    local:                     # no cloud needed: runs on DuckDB from the CSVs
      type: duckdb
      path: "../data/psx.duckdb"
      schema: mart
      threads: 4
