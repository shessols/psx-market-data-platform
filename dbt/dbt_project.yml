name: psx
version: "1.0.0"
config-version: 2
profile: psx

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  min_price: 5          # keep in sync with config.yaml
  min_volume: 100000
  top_n: 5
  # duckdb target only: local CSVs to load as the RAW layer
  prices_csv: "../data/psx_daily.csv"
  stocks_csv: "../data/psx_stocks.csv"

on-run-start:
  - "{{ load_local_raw() }}"

models:
  psx:
    staging:
      +materialized: view
    marts:
      +materialized: table
